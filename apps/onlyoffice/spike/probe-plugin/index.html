<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>ACP Assist Probe</title>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
    <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
    <style>
        body { font: 12px Arial; margin: 8px; }
        button { display: block; width: 100%; margin: 4px 0; padding: 6px; }
        #log { white-space: pre-wrap; word-break: break-all;
               background: #f0f0f0; padding: 4px; height: 240px; overflow: auto;
               font: 11px monospace; }
        .err { color: #c00; } .ok { color: #070; }
    </style>
    <script type="text/javascript" src="scripts/code.js"></script>
</head>
<body>
    <button id="b-ping">P2: ping companion</button>
    <button id="b-insert">P1: insert text at cursor</button>
    <button id="b-read">P4: read document</button>
    <button id="b-selection">P3: selection snapshot</button>
    <button id="b-attach">P3: try onSelectionChange event</button>
    <button id="b-poll">P3: toggle 2s selection poll</button>
    <div id="log"></div>
</body>
</html>
