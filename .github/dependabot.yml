version: 2

updates:
  # Root lockfile covers all npm workspaces (apps/*, packages/*)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  # Keep GitHub Actions pinned and current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
