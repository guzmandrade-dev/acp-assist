version: 2

updates:
  # Root lockfile (workspaces root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  # Monorepo workspace packages
  - package-ecosystem: npm
    directory: /apps/*
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /packages/*
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  # Keep GitHub Actions pinned and current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
