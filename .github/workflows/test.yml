name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: 22

jobs:
  test:
    # A wedged worker (e.g. a blocked pipe open) must fail the job in minutes,
    # not sit for the 6h default until the runner gives up (seen 2026-11-26).
    timeout-minutes: 30
    # Tests are cross-platform: the LyX pipe-mock uses named pipes on
    # Windows and FIFOs on Linux/macOS, so both OSes exercise the real
    # choreography suites (not skips).
    strategy:
      fail-fast: false
      matrix:
        app: [lyx, libreoffice, onlyoffice, acp-assist]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (all workspaces)
        run: npm ci

      - name: Run tests
        run: npm test
        working-directory: apps/${{ matrix.app }}
        env:
          # The PowerShell named-pipe transport suites wedged this job for hours
          # (2026-11-26); ubuntu CI covers the same wire protocol via FIFOs and
          # local Windows runs cover named pipes.
          LYX_SKIP_PIPE_MOCK: ${{ matrix.app == 'lyx' && matrix.os == 'windows-latest' && '1' || '' }}

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/${{ matrix.app }}