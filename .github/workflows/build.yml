name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  test:
    # Tests are cross-platform: the LyX pipe-mock uses named pipes on
    # Windows and FIFOs on Linux/macOS, so both OSes exercise the real
    # choreography suites (not skips).
    strategy:
      fail-fast: false
      matrix:
        app: [lyx, libreoffice]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (all workspaces)
        run: npm ci

      - name: Run tests
        run: npm test
        working-directory: apps/${{ matrix.app }}

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/${{ matrix.app }}

  # Build inputs that are rebuilt on CI: the LibreOffice bridge .oxt is
  # rebuilt from extension/ sources by scripts/package-oxt.py and the
  # ONLYOFFICE bridge .plugin by scripts/package-plugin.mjs. The per-OS
  # build jobs download these back at their original paths before packaging.
  # This workflow only runs on release tags and manual dispatches, so the
  # full pipeline (test -> assets -> build -> release) always completes;
  # `release` still skips on dispatches (no tag to publish).
  # Only the UNIFIED app (apps/acp-assist) is packaged and released. The
  # libreoffice/onlyoffice entries below exist only to build the bridge
  # artifacts (.oxt/.plugin) that the unified installer bundles as
  # extraResources (and that ship alongside it on the release).
  assets:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        app: [acp-assist, libreoffice, onlyoffice]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Package bridge extension (.oxt)
        if: matrix.app == 'libreoffice'
        run: python scripts/package-oxt.py
        working-directory: apps/libreoffice

      - name: Package bridge plugin (.plugin)
        if: matrix.app == 'onlyoffice'
        run: node scripts/package-plugin.mjs
        working-directory: apps/onlyoffice

      # acp-assist icons are committed (rendered once from public/logo.svg).
      - name: Upload app icons
        if: matrix.app == 'acp-assist'
        uses: actions/upload-artifact@v4
        with:
          name: app-icons-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/build/icon.ico
            apps/${{ matrix.app }}/build/icon-256.png
            apps/${{ matrix.app }}/build/icon-512.png
          if-no-files-found: error

      - name: Upload bridge extension
        if: matrix.app == 'libreoffice'
        uses: actions/upload-artifact@v4
        with:
          name: bridge-oxt
          path: apps/libreoffice/acp-bridge.oxt
          if-no-files-found: error

      - name: Upload bridge plugin
        if: matrix.app == 'onlyoffice'
        uses: actions/upload-artifact@v4
        with:
          name: bridge-plugin
          path: apps/onlyoffice/acp-bridge.plugin
          if-no-files-found: error

  build:
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        app: [acp-assist]
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (all workspaces)
        run: npm ci

      - name: Download app icons
        uses: actions/download-artifact@v4
        with:
          name: app-icons-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build

      # The unified app packages both bridges as extraResources from the
      # sibling app directories.
      - name: Download bridge extension
        uses: actions/download-artifact@v4
        with:
          name: bridge-oxt
          path: apps/libreoffice

      - name: Download bridge plugin
        uses: actions/download-artifact@v4
        with:
          name: bridge-plugin
          path: apps/onlyoffice

      - name: Build application
        run: npm run build
        working-directory: apps/${{ matrix.app }}

      - name: Package application
        run: npx electron-builder --publish never
        working-directory: apps/${{ matrix.app }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist-release/*.dmg
          if-no-files-found: warn

      - name: Upload macOS zip artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist-release/*.zip
          if-no-files-found: warn

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist-release/*.AppImage
          if-no-files-found: warn

      - name: Upload Linux deb artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist-release/*.deb
          if-no-files-found: warn

      - name: Upload Linux tar artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist-release/*.tar.gz
          if-no-files-found: warn

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/dist-release/*.exe
            apps/${{ matrix.app }}/dist-release/*.zip
          if-no-files-found: warn

      # The bridges ship as release assets too (the editors need them
      # installed on their side; the installer also bundles them).
      - name: Upload bridge extension with Windows build
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-oxt
          path: apps/libreoffice/acp-bridge.oxt
          if-no-files-found: warn

      - name: Upload bridge plugin with Windows build
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-plugin
          path: apps/onlyoffice/acp-bridge.plugin
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}